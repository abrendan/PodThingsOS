<svg xmlns="http://www.w3.org/2000/svg" width="256" height="400" viewBox="0 0 256 400" fill="none">
  <title>PodThings OS iPod logo</title>
  <desc>A cream and lavender click-wheel iPod with a purple music screen, leaning slightly to the left. Transparent background.</desc>
  <defs>
    <linearGradient id="body" x1="24" y1="24" x2="232" y2="376" gradientUnits="userSpaceOnUse">
