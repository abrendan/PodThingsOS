name: Host tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native-host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check public repository contents
        run: python3 scripts/check-public-repo.py
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 pkg-config libfreetype6-dev
      - name: Prepare Unicode font fixtures
        run: bash scripts/prepare-host-tests.sh
      - name: Test native helpers
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Check scripts
        run: |
          bash -n scripts/*.sh
          python3 -m compileall -q scripts tests
